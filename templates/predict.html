{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    <div class="container">

        <h1>Sentiment Analysis Result</h1>

        <p><strong>Your Review:</strong></p>
        <p>{{ review }}</p>

        <p><strong>Predicted Sentiment:</strong></p>
        <h2 class="result {{ sentiment }}">{{ sentiment }}</h2>
        <br>

        <a href="/">Try Another Review</a>

        <br>

        <a href="/history/">View Feedback History</a>

    </div>

</body>
</html>
